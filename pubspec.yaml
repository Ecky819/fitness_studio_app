name: fitness_studio_access
description: Hybrid BLE + QR door access for fitness studios
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.4.0
  qr_flutter: ^4.1.0
  http: ^1.2.0
  vibration: ^1.8.4
  url_launcher: ^6.2.0
  flutter_secure_storage: ^9.0.0
  fl_chart: ^0.68.0
  flutter_blue_plus: ^1.32.0
  local_auth: ^2.3.0
  web_socket_channel: ^3.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
