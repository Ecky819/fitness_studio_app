apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitness-studio-ingress
  namespace: fitness-studio
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Rate limiting — protects access + auth endpoints
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Stripe webhook needs raw body — disable buffering on that route
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # TLS cert managed by cert-manager (Let's Encrypt)
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.fitnessstudio.com
      secretName: fitness-studio-tls
  rules:
    - host: api.fitnessstudio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fitness-studio-api-service
                port:
                  number: 80
